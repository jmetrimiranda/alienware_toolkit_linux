<!doctype html>
<!-- Visualizador 3D dos aparelhos Alienware (mouse AW720M, headset AW725H, teclado genérico).
     Carregado pelo ui/visualizador3d.py dentro de um WebKit.WebView (file://).
     A API fica em window.aw3d (ver js/principal.js). -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Visualizador 3D Alienware</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1d21; }
  canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; touch-action: none; }
  canvas.arrastando { cursor: grabbing; }
  canvas.sobre-zona { cursor: pointer; }
  /* dica (tooltip) das zonas de luz, no mesmo estilo do painel */
  #dica {
    position: fixed; display: none; pointer-events: none; z-index: 2;
    font: 12px "Inter", "Cantarell", sans-serif; color: #e8eaed;
    background: #24272c; border: 1px solid #31353b; border-radius: 4px; padding: 4px 8px;
  }
  /* aviso quando o WebGL não está disponível */
  #aviso {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    font: 13px "Inter", "Cantarell", sans-serif; color: #8a9099; text-align: center;
  }
</style>
<script>
  // erros de JavaScript vão para o Python (que mostra o SVG de reserva) e aparecem na página
  function aw3dErro(texto) {
    var aviso = document.getElementById('aviso');
    if (aviso) { aviso.textContent = texto; aviso.style.display = 'flex'; }
    var h = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.aw3d;
    if (h) h.postMessage(JSON.stringify({ tipo: 'erro', mensagem: texto }));
  }
  window.addEventListener('error', function (e) {
    aw3dErro('Erro: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ':' + e.lineno + ')');
  });
  window.addEventListener('unhandledrejection', function (e) { aw3dErro('Erro: ' + e.reason); });
</script>
<script type="importmap">
  { "imports": {
      "three": "../vendor/three/three.module.min.js",
      "../vendor/three/three.core.js": "../vendor/three/three.core.min.js"
  } }
</script>
</head>
<body>
<div id="dica"></div>
<div id="aviso"></div>
<script type="module" src="js/principal.js"></script>
</body>
</html>
